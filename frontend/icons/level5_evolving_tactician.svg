<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="#170c0c" stroke="url(#gradGold)" stroke-width="2" />

  <!-- Adversarial Red Wing (Left) -->
  <path d="M 50 50 L 20 30 Q 15 50 30 70 Z" fill="url(#gradRed)" opacity="0.85" stroke="#EF4444" stroke-width="1.5" />

  <!-- Adversarial Blue Wing (Right) -->
  <path d="M 50 50 L 80 30 Q 85 50 70 70 Z" fill="url(#gradBlue)" opacity="0.85" stroke="#3B82F6" stroke-width="1.5" />

  <!-- Central AI Core Pillar / Scale Stand -->
  <line x1="50" y1="20" x2="50" y2="80" stroke="url(#gradGold)" stroke-width="4" stroke-linecap="round" />
  <line x1="25" y1="35" x2="75" y2="35" stroke="url(#gradGold)" stroke-width="3" stroke-linecap="round" />

  <!-- Scale Pans -->
  <!-- Left Pan (Red Team) -->
  <path d="M 20 35 L 20 50 M 12 50 H 28 L 20 58 Z" stroke="#EF4444" stroke-width="2" fill="url(#gradRed)" />

  <!-- Right Pan (Blue Team) -->
  <path d="M 80 35 L 80 50 M 72 50 H 88 L 80 58 Z" stroke="#3B82F6" stroke-width="2" fill="url(#gradBlue)" />

  <!-- Central Glowing AI Core Orb -->
  <circle cx="50" cy="35" r="9" fill="url(#gradGold)" filter="url(#glow5)" stroke="#ffffff" stroke-width="2" />
  <polygon points="50 29, 54 35, 50 41, 46 35" fill="#ffffff" />
</svg>
