<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="#091026" stroke="url(#grad2)" stroke-width="2" />

  <!-- Radar Outer Rings -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#grad2)" stroke-width="1" opacity="0.3" stroke-dasharray="3,3" />
  <circle cx="50" cy="50" r="28" fill="none" stroke="url(#grad2)" stroke-width="1.5" opacity="0.5" />

  <!-- Cybernetic Eye Outline -->
  <path d="M 15 50 Q 50 20 85 50 Q 50 80 15 50 Z" fill="none" stroke="url(#grad2)" stroke-width="4" filter="url(#glow2)" />

  <!-- Iris & Target -->
  <circle cx="50" cy="50" r="14" fill="#091026" stroke="url(#grad2)" stroke-width="3" />
  <circle cx="50" cy="50" r="6" fill="#00C6FF" filter="url(#glow2)" />

  <!-- Radar Crosshair Lines -->
  <line x1="50" y1="20" x2="50" y2="80" stroke="#00C6FF" stroke-width="1.5" opacity="0.6" stroke-dasharray="2,2" />
  <line x1="20" y1="50" x2="80" y2="50" stroke="#00C6FF" stroke-width="1.5" opacity="0.6" stroke-dasharray="2,2" />

  <!-- Satellite Radar Sweep Nodes -->
  <circle cx="68" cy="36" r="3" fill="#ffffff" filter="url(#glow2)" />
  <circle cx="32" cy="62" r="2" fill="#00C6FF" opacity="0.8" />
</svg>
