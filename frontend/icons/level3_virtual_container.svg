<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="#120c24" stroke="url(#grad3)" stroke-width="2" />

  <!-- 3D Isometric Glass Cube Edges -->
  <!-- Top Face -->
  <polygon points="50 18, 78 32, 50 46, 22 32" fill="url(#grad3)" opacity="0.25" stroke="url(#grad3)" stroke-width="2" />
  
  <!-- Left Face -->
  <polygon points="22 32, 50 46, 50 78, 22 64" fill="url(#grad3)" opacity="0.15" stroke="url(#grad3)" stroke-width="2" />

  <!-- Right Face -->
  <polygon points="78 32, 50 46, 50 78, 78 64" fill="url(#grad3)" opacity="0.3" stroke="url(#grad3)" stroke-width="2" filter="url(#glow3)" />

  <!-- Enclosed Padlock Icon inside Cube -->
  <!-- Lock Shackle -->
  <path d="M 43 45 V 39 A 7 7 0 0 1 57 39 V 45" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <!-- Lock Body -->
  <rect x="40" y="45" width="20" height="16" rx="3" fill="url(#grad3)" stroke="#ffffff" stroke-width="2" filter="url(#glow3)" />
  <circle cx="50" cy="52" r="2" fill="#ffffff" />

  <!-- Isolated Node Dots -->
  <circle cx="22" cy="32" r="3" fill="#A855F7" />
  <circle cx="78" cy="32" r="3" fill="#6366F1" />
  <circle cx="50" cy="78" r="3" fill="#A855F7" />
  <circle cx="50" cy="18" r="3" fill="#ffffff" filter="url(#glow3)" />
</svg>
